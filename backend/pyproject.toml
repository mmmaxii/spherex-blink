[project]
name = "spherex-blink-backend"
version = "0.1.0"
description = "FastAPI backend for SPHEREx Blink: finds SPHEREx images of a sky position, reads them from S3 and returns aligned, stacked cutouts and spectra."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.117",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "scipy>=1.13",
    "astropy>=6.1",
    "astroquery>=0.4.10",
    "pyvo>=1.5",
    "fsspec>=2024.6",
    "aiohttp>=3.9",
    "reproject>=0.14",
    "pillow>=10",
    "sep>=1.4",
    "photutils>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.data" = ["calibration_dr1.npz"]  # calibration grid shipped with the API (data/calibration.py)

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"  # tests that need internet run with: pytest -m live
markers = ["live: uses the real services (IRSA, S3, CDS, ESA)"]
filterwarnings = [
    "ignore:Input data contains invalid values",
    "ignore:Mean of empty slice",
    "ignore:All-NaN slice encountered",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

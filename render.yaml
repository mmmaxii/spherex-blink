# Render Blueprint for the FastAPI backend (one instance).
# Region close to the SPHEREx S3 bucket (us-east-1). Choose a plan with >= 1-2 GB RAM that does not sleep.
services:
  - type: web
    name: spherex-blink-api
    runtime: python
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install --no-deps .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
